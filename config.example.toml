# 复制为 config.local.toml。每个部署只改自己的 api_key 即可，重启生效。
[deepseek]
api_key = ""
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
timeout_seconds = 25

[app]
title = "补货建议与库存检查"
data_dir = "data"
# 留空使用本地 SQLite；可填写 mysql+pymysql://user:password@127.0.0.1:3306/retail
database_url = ""
# 留空使用内存缓存；可填写 redis://127.0.0.1:6379/0
redis_url = ""
cache_ttl_seconds = 120
node_timeout_seconds = 45
max_tool_calls = 8
max_graph_steps = 16
seed_demo = true
